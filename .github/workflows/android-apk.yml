name: Charlie Android APK (container)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: charlie-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Validate project files
        run: |
          set -eux
          python3 -m py_compile main.py
          grep -Fx 'requirements = python3,kivy,pyjnius,android' buildozer.spec
          grep -Fx 'android.permissions = CAMERA,RECORD_AUDIO' buildozer.spec
          test ! -f .github/workflows/build-apk.yml

      # Pull the published Kivy Buildozer image directly.  This avoids the
      # obsolete third-party action Dockerfile, whose *Docker build* fails
      # before Buildozer gets a chance to run.
      - name: Build debug APK with published Kivy image
        run: |
          set -eux
          docker pull kivy/buildozer:latest
          # The image entrypoint creates and switches to its build user. Do not
          # pass --user here: it prevents that setup and causes `groupadd:
          # Permission denied` before Buildozer starts.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            --workdir /home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Check generated APK
        id: apk
        shell: bash
        run: |
          set -eux
          apk=$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-Sensors-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

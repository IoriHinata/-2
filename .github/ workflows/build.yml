name: Build Charlie APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Charlie Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint gettext \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install cython==0.29.34

      - name: Clean old build
        run: |
          rm -rf .buildozer bin

      - name: Check project
        run: |
          python --version
          cython --version
          buildozer --version
          python -m py_compile main.py

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          find bin -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-APK
          path: bin/*.apk
          if-no-files-found: error
